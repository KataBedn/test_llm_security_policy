name: LLM Red Teaming Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-regression:
    name: Run LLM Security Policies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Execute Red Teaming Test Suite
        env:
          # Securely inject OpenAI API credentials from GitHub repository secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest -v tests/test_security.py