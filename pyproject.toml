[project]
name = "llm-security-suite"
version = "0.1.0"
description = "Automated Security & Red Teaming Test Suite for LLMs"
dependencies = [
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v -s"